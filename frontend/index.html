<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema A2 Pousada</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="logo-a2.png">
<link rel="stylesheet" href="styles.css?v=20261001-23">
<script>
(function(){
  try{
    var t=localStorage.getItem('temaPreferido');
    if(!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t='escuro';
    if(t==='escuro') document.documentElement.setAttribute('data-tema','escuro');
  }catch(e){}
})();
</script>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="tela-login">
  <div class="login-caixa">
    <img class="logo-login logo-tema-claro" src="logo-a2.png" alt="A2 Pousada">
    <img class="logo-login logo-tema-escuro" src="logo-a2-dark.png" alt="A2 Pousada">
    <h1>Bem-vindo de volta</h1>
    <p class="sub">Acesse o sistema de gestão da rede A2 Pousada.</p>
    <div id="erro-login" class="erro oculto" role="alert"></div>
    <div class="campo">
      <label for="in-login">Usuário</label>
      <input id="in-login" autocomplete="username" placeholder="digite seu usuário">
    </div>
    <div class="campo">
      <label for="in-senha">Senha</label>
      <input id="in-senha" type="password" autocomplete="current-password">
    </div>
    <button class="btn-principal" data-click="entrar()">Entrar</button>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="modal-confirmacao" class="modal-overlay oculto">
  <div class="modal-caixa">
    <p id="modal-confirmacao-texto"></p>
    <div class="modal-acoes">
      <button class="btn-cancelar" id="modal-confirmacao-cancelar">Cancelar</button>
      <button class="btn-salvar" id="modal-confirmacao-ok">Confirmar</button>
    </div>
  </div>
</div>

<div id="modal-aviso" class="modal-overlay oculto">
  <div class="modal-caixa">
    <p id="modal-aviso-texto"></p>
    <div class="modal-acoes">
      <button class="btn-salvar" id="modal-aviso-ok">OK</button>
    </div>
  </div>
</div>

<div id="modal-prompt" class="modal-overlay oculto">
  <div class="modal-caixa">
    <p id="modal-prompt-texto"></p>
    <input id="modal-prompt-input" type="text" class="campo-prompt">
    <div class="modal-acoes">
      <button class="btn-cancelar" id="modal-prompt-cancelar">Cancelar</button>
      <button class="btn-salvar" id="modal-prompt-ok">OK</button>
    </div>
  </div>
</div>

<div id="modal-editar-lancamento" class="modal-overlay oculto">
  <div class="modal-caixa modal-edicao">
    <h3 class="titulo-form-destaque">Editar lançamento</h3>
    <div class="form-linha">
      <div>
        <label for="ml-categoria">Categoria</label>
        <select id="ml-categoria"></select>
      </div>
      <div>
        <label for="ml-turno">Turno</label>
        <select id="ml-turno">
          <option value="dia">Dia</option>
          <option value="noite">Noite</option>
        </select>
      </div>
    </div>
    <div class="form-linha">
      <div>
        <label for="ml-valor">Valor (R$)</label>
        <input type="number" id="ml-valor" min="0" step="0.01">
      </div>
    </div>
    <div class="form-linha">
      <div class="u-coluna-inteira">
        <label for="ml-obs">Descrição</label>
        <input id="ml-obs">
      </div>
    </div>
    <p id="modal-editar-lancamento-erro" class="erro oculto u-mt-0"></p>
    <div class="modal-acoes">
      <button class="btn-cancelar" id="modal-editar-lancamento-cancelar">Cancelar</button>
      <button class="btn-salvar" id="modal-editar-lancamento-ok">Salvar</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="menu-fundo" data-click="alternarMenu(false)"></div>

  <nav class="abas" id="menu-principal" aria-label="Módulos do sistema">
    <button class="btn-recolher" data-click="alternarMenu()" aria-controls="menu-principal" aria-expanded="true" aria-label="Recolher menu" title="Recolher/expandir menu"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="marca-menu">
      <img class="logo-menu logo-tema-claro" alt="A2 Pousada" src="logo-a2.png">
      <img class="logo-menu logo-tema-escuro" alt="A2 Pousada" src="logo-a2-dark.png">
    </div>
    <div class="lista-menu">
    <span class="grupo-menu">Visão geral</span>
    <button id="aba-painel" class="ativa" data-click="abrir('painel')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Painel</span></button>
    <button id="aba-rede" class="oculto" data-click="abrir('rede')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5l-5.5 5.5M12 11.5l5.5 5.5"/></svg><span>Rede</span></button>
    <button id="aba-relatorio" class="oculto" data-click="abrir('relatorio')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg><span>Relatório</span></button>
    <span class="grupo-menu">Caixa</span>
    <button id="aba-lancar" data-click="abrir('lancar')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Lançar movimento</span></button>
    <button id="aba-extrato" data-click="abrir('extrato')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Extrato do dia</span></button>
    <button id="aba-comprovantes" data-click="abrir('comprovantes')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="M21 16l-5-5-8 8"/></svg><span>Comprovantes</span></button>
    <button id="aba-fechamento" data-click="abrir('fechamento')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><span>Fechamento</span></button>
    <span class="grupo-menu">Operação</span>
    <button id="aba-consumo-plantao" data-click="abrir('consumo-plantao')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11a2 2 0 01-2 1.8H8.2a2 2 0 01-2-1.8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg><span>Consumo do plantão</span></button>
    <button id="aba-vistoria" data-click="abrir('vistoria')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l2.5 2.5L16 9"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg><span>Vistoria de suítes</span></button>
    <button id="aba-manutencao" data-click="abrir('manutencao')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5a4 4 0 005 5L10 21a2.1 2.1 0 01-3-3z"/><path d="M14.5 6.5l3-3 3 3-3 3"/></svg><span>Manutenção</span></button>
    <span class="grupo-menu">Financeiro</span>
    <button id="aba-boletos" data-click="abrir('boletos')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M8 5v14M12 5v14M15 5v14M19 5v14"/></svg><span>Boletos e Pix</span></button>
    <button id="aba-impostos" data-click="abrir('impostos')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 13h6l-1 8 8-10h-6z"/></svg><span>Impostos e Energia</span></button>
    <button id="aba-boletos-admin" data-click="abrir('boletos-admin')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg><span>Boletos administrativo</span></button>
    <button id="aba-notas-fiscais" data-click="abrir('notas-fiscais')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-2.5-1.7L12 21l-2.5-1.7L7 21z"/><path d="M10 8h4M10 12h4"/></svg><span>Notas fiscais</span></button>
    <span class="grupo-menu">Gestão</span>
    <button id="aba-funcionarios" data-click="abrir('funcionarios')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0M16 4.8a3.5 3.5 0 010 6.4M18 14a6 6 0 013.5 6"/></svg><span>Funcionários</span></button>
    <button id="aba-vencidos" data-click="abrir('vencidos')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 4.5v9L12 21l-9-4.5v-9z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/></svg><span>Produtos Vencidos</span></button>
    <button id="aba-revpar" data-click="abrir('revpar')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>RevPAR</span></button>
    <span class="grupo-menu">Sistema</span>
    <button id="aba-usuarios" class="oculto" data-click="abrir('usuarios')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span>Usuários e acessos</span></button>
    <button id="aba-historico-exclusoes" class="oculto" data-click="abrir('historico-exclusoes')"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Histórico de Exclusões</span></button>
    </div>
  </nav>

  <div class="palco">
  <header class="topo">
    <button class="btn-menu" data-click="alternarMenu()" aria-label="Abrir menu" aria-controls="menu-principal">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="logo-topo">
      <img class="logo-topo-img logo-tema-claro" alt="A2 Pousada" src="logo-a2.png">
      <img class="logo-topo-img logo-tema-escuro" alt="A2 Pousada" src="logo-a2-dark.png">
    </div>
    <div class="titulo-tela">
      <div class="trilha" id="trilha-tela"></div>
      <div class="nome-tela" id="titulo-tela">Sistema A2 Pousada</div>
    </div>
    <div class="direita">
      <div class="menu-usuario" id="menu-usuario">
        <button class="btn-usuario" id="btn-usuario" data-click="alternarMenuUsuario()" aria-haspopup="menu" aria-expanded="false" aria-controls="dropdown-usuario">
          <span class="avatar" id="avatar-usuario" aria-hidden="true"></span>
          <span class="quem"><strong id="nome-usuario"></strong><span id="papel-usuario"></span></span>
          <svg class="icone seta-usuario" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="dropdown-usuario oculto" id="dropdown-usuario" role="menu" aria-labelledby="btn-usuario">
          <div class="dd-cabecalho">
            <span class="avatar avatar-grande" id="avatar-usuario-grande" aria-hidden="true"></span>
            <div class="dd-identidade"><strong id="dd-nome"></strong><span id="dd-login"></span></div>
          </div>
          <dl class="dd-dados">
            <div><dt>Nível de acesso</dt><dd id="dd-papel"></dd></div>
            <div><dt>Unidades</dt><dd id="dd-unidades"></dd></div>
          </dl>
          <button class="dd-item dd-tema" id="btn-tema" role="menuitem" data-click="alternarTema()">
            <svg class="icone icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icone icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <span id="label-btn-tema">Tema escuro</span>
          </button>
          <button class="dd-item dd-sair" role="menuitem" data-click="sair()">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H6a2 2 0 00-2 2v12a2 2 0 002 2h3M16 8l4 4-4 4M20 12H9"/></svg>
            <span>Sair do sistema</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="barra-unidade barra-contexto">
    <div class="filtro">
      <label for="sel-unidade">Unidade</label>
      <select id="sel-unidade" data-change="desenhar()"></select>
    </div>
    <div class="filtro">
      <label for="sel-data">Data</label>
      <input type="date" id="sel-data" data-change="desenhar()">
    </div>
    <div class="filtro">
      <label for="sel-periodo">Período do painel</label>
      <select id="sel-periodo" data-change="desenhar()">
        <option value="1">Somente o dia selecionado</option>
        <option value="7" selected>Últimos 7 dias</option>
        <option value="30">Últimos 30 dias</option>
      </select>
    </div>
    <span id="aviso-data-travada" class="aviso-data-campo oculto">Só gerente e diretor mudam a data</span>
  </div>

  <main id="conteudo-modulos"></main>
  </div>

  <div class="lightbox" id="lightbox" data-click="if(event.target===this) fecharLightbox()">
    <div class="caixa-lb">
      <img id="lightbox-img" alt="Comprovante ampliado">
      <div class="legenda-lb" id="lightbox-legenda"></div>
      <button class="fechar-lb" data-click="fecharLightbox()">Fechar</button>
    </div>
  </div>
</div>

<script src="core/modulos.js?v=20261001-23"></script>
<script src="core/api.js?v=20261001-23"></script>
<script src="core/estado.js?v=20261001-23"></script>
<script src="core/ui.js?v=20261001-23"></script>
<script src="core/views.js?v=20261001-23"></script>
<script src="core/app.js?v=20261001-23"></script>
<script src="core/erros.js?v=20261001-23"></script>
<script src="core/acoes.js?v=20261001-23"></script>
<script src="core/bootstrap.js?v=20261001-23"></script>
</body>
</html>
